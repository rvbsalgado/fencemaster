{{- if .Values.sync.enabled }}
{{- if not (has .Values.installMode (list "server" "all")) }}
{{- fail "sync.enabled requires installMode server or all, as it runs in the management cluster" }}
{{- end }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fencemaster.sync.serviceAccountName" . }}
  labels:
    {{- include "fencemaster.sync.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "fencemaster.sync.fullname" . }}
  labels:
    {{- include "fencemaster.sync.labels" . | nindent 4 }}
rules:
  - apiGroups: ["management.cattle.io"]
    resources: ["projects"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "fencemaster.sync.fullname" . }}
  labels:
    {{- include "fencemaster.sync.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "fencemaster.sync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "fencemaster.sync.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fencemaster.sync.fullname" . }}
  namespace: {{ .Values.sync.fleetNamespace }}
  labels:
    {{- include "fencemaster.sync.labels" . | nindent 4 }}
rules:
  - apiGroups: ["provisioning.cattle.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  # Server-side apply: "create" for a new Bundle, "patch" for an existing one
  - apiGroups: ["fleet.cattle.io"]
    resources: ["bundles"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "fencemaster.sync.fullname" . }}
  namespace: {{ .Values.sync.fleetNamespace }}
  labels:
    {{- include "fencemaster.sync.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "fencemaster.sync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "fencemaster.sync.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fencemaster.sync.fullname" . }}
  labels:
    {{- include "fencemaster.sync.labels" . | nindent 4 }}
spec:
  {{- /* ponytail: no leader election, so one replica (writes are idempotent, a second would only duplicate work) */}}
  replicas: 1
  selector:
    matchLabels:
      {{- include "fencemaster.sync.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "fencemaster.sync.selectorLabels" . | nindent 8 }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fencemaster.sync.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "fencemaster.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          env:
            - name: MODE
              value: "sync"
            - name: PROJECT_IDS_CONFIGMAP
              value: {{ .Values.sync.projectIdsConfigMap | quote }}
            - name: RESYNC_MINUTES
              value: {{ .Values.sync.resyncMinutes | quote }}
            - name: SYNC_CLUSTER_SELECTOR
              value: {{ include "fencemaster.sync.clusterSelector" . | quote }}
            - name: FLEET_NAMESPACE
              value: {{ .Values.sync.fleetNamespace | quote }}
            - name: DRY_RUN
              value: {{ .Values.sync.dryRun | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
