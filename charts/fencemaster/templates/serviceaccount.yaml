{{- if and .Values.serviceAccount.create (has .Values.installMode (list "server" "all" "controller")) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fencemaster.serviceAccountName" . }}
  labels:
    {{- include "fencemaster.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
